<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="680" viewBox="0 0 1110 680" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="1110" height="680" fill="#ffffff"/>

  <!-- Title -->
  <text x="555" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#000000" letter-spacing="3">KINGS OF EWING — STAGE DIAGRAM</text>
  <line x1="55" y1="46" x2="1055" y2="46" stroke="#000000" stroke-width="1.5"/>

  <!-- Stage box -->
  <rect x="80" y="58" width="640" height="540" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- BACK label bar -->
  <rect x="80" y="58" width="640" height="28" fill="#ffffff" rx="6"/>
  <line x1="80" y1="86" x2="720" y2="86" stroke="#000000" stroke-width="1"/>
  <text x="400" y="77" text-anchor="middle" font-size="11" fill="#000000" letter-spacing="6">BACK</text>

  <!-- AUDIENCE label -->
  <text x="400" y="665" text-anchor="middle" font-size="11" fill="#000000" letter-spacing="6">AUDIENCE</text>

  <!-- ── DIMENSIONS (approx. minimum footprint) ── -->
  <!-- width -->
  <line x1="82" y1="612" x2="718" y2="612" stroke="#000000" stroke-width="1"/>
  <polygon points="82,612 91,608 91,616" fill="#000000"/>
  <polygon points="718,612 709,608 709,616" fill="#000000"/>
  <rect x="360" y="605" width="80" height="14" fill="#ffffff"/>
  <text x="400" y="616" text-anchor="middle" font-size="9" font-weight="bold" fill="#000000">≈ 20 ft</text>
  <!-- depth -->
  <line x1="64" y1="88" x2="64" y2="596" stroke="#000000" stroke-width="1"/>
  <polygon points="64,88 60,97 68,97" fill="#000000"/>
  <polygon points="64,596 60,587 68,587" fill="#000000"/>
  <text x="52" y="342" text-anchor="middle" font-size="9" font-weight="bold" fill="#000000" transform="rotate(-90,52,342)">≈ 16 ft</text>

  <!-- ── AMPS (back row) ── -->
  <rect x="128" y="155" width="65" height="36" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="160" y="170" text-anchor="middle" font-size="9" fill="#000000" font-weight="bold">AMP</text>
  <text x="160" y="184" text-anchor="middle" font-size="8" fill="#000000">Lead Gtr</text>

  <rect x="250" y="108" width="100" height="36" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="300" y="123" text-anchor="middle" font-size="8" fill="#000000" font-weight="bold">AMP (w/ XLR out)</text>
  <text x="300" y="137" text-anchor="middle" font-size="8" fill="#000000">Keys</text>

  <rect x="468" y="108" width="65" height="36" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="500" y="123" text-anchor="middle" font-size="9" fill="#000000" font-weight="bold">AMP</text>
  <text x="500" y="137" text-anchor="middle" font-size="8" fill="#000000">Bass</text>

  <rect x="608" y="155" width="65" height="36" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="640" y="170" text-anchor="middle" font-size="9" fill="#000000" font-weight="bold">AMP</text>
  <text x="640" y="184" text-anchor="middle" font-size="8" fill="#000000">Rhythm Gtr</text>

  <!-- ── DRUMS ── -->
  <!-- Drummer circle — center back -->
  <circle cx="400" cy="172" r="32" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="400" y="176" text-anchor="middle" font-size="10" fill="#000000" font-weight="bold">DRUMMER</text>

  <!-- Kick drum -->
  <ellipse cx="400" cy="272" rx="42" ry="32" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="400" y="268" text-anchor="middle" font-size="10" fill="#000000" font-weight="bold">KICK</text>
  <text x="400" y="282" text-anchor="middle" font-size="9" fill="#000000">DRUM</text>

  <!-- Snare (center, in front of drummer) -->
  <ellipse cx="400" cy="228" rx="17" ry="13" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="400" y="232" text-anchor="middle" font-size="8" fill="#000000">SN</text>

  <!-- Rack tom -->
  <ellipse cx="355" cy="258" rx="16" ry="12" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="355" y="262" text-anchor="middle" font-size="8" fill="#000000">TOM</text>

  <!-- Floor tom -->
  <ellipse cx="334" cy="225" rx="20" ry="16" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="334" y="229" text-anchor="middle" font-size="8" fill="#000000">FT</text>

  <!-- Crash cymbal -->
  <ellipse cx="320" cy="192" rx="24" ry="7" fill="#ffffff" stroke="#000000" stroke-width="1.5" transform="rotate(-10,320,192)"/>
  <text x="302" y="183" text-anchor="middle" font-size="8" fill="#000000">CRASH</text>

  <!-- Hi-hat -->
  <ellipse cx="444" cy="195" rx="22" ry="7" fill="#ffffff" stroke="#000000" stroke-width="1.5" transform="rotate(10,444,195)"/>
  <text x="426" y="186" text-anchor="middle" font-size="8" fill="#000000">HH</text>

  <!-- Ride -->
  <ellipse cx="466" cy="228" rx="20" ry="7" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="482" y="218" text-anchor="middle" font-size="8" fill="#000000">RIDE</text>

  <!-- ══ POS 1 — Lead Guitar / Vocals (Stage Right) ══ -->
  <circle cx="160" cy="415" r="32" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="160" y="411" text-anchor="middle" font-size="10" fill="#000000" font-weight="bold">LEAD</text>
  <text x="160" y="425" text-anchor="middle" font-size="10" fill="#000000" font-weight="bold">GUITAR</text>
  <polygon points="160,447 170,461 160,475 150,461" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ══ POS 2 — Keys / Vocals (center left) ══ -->
  <circle cx="300" cy="330" r="32" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="300" y="334" text-anchor="middle" font-size="10" fill="#000000" font-weight="bold">KEYS</text>
  <polygon points="300,362 310,376 300,390 290,376" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ══ POS 4 — Bass / Vocals (center right) ══ -->
  <circle cx="500" cy="330" r="32" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="500" y="334" text-anchor="middle" font-size="10" fill="#000000" font-weight="bold">BASS</text>
  <polygon points="500,362 510,376 500,390 490,376" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- DI — Bass (in front of Bass amp) -->
  <rect x="462" y="155" width="76" height="20" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="500" y="168" text-anchor="middle" font-size="8" fill="#000000">DI — Bass</text>

  <!-- ══ POS 5 — Gtr / Aux Keys / Trombone / Vocals (Stage Left) ══ -->
  <circle cx="640" cy="415" r="32" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="640" y="405" text-anchor="middle" font-size="9" fill="#000000" font-weight="bold">RHY GTR</text>
  <text x="640" y="418" text-anchor="middle" font-size="9" fill="#000000" font-weight="bold">AUX KEYS</text>
  <text x="640" y="431" text-anchor="middle" font-size="9" fill="#000000" font-weight="bold">TROMBONE</text>
  <polygon points="640,447 650,461 640,475 630,461" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- DI boxes — in front of Rhythm Gtr amp -->
  <rect x="600" y="214" width="80" height="18" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="640" y="227" text-anchor="middle" font-size="7" fill="#000000">DI — Aux Keys</text>
  <rect x="600" y="236" width="80" height="18" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="640" y="249" text-anchor="middle" font-size="7" fill="#000000">DI — Acoustic Gtr</text>

  <!-- ── FLOOR MONITORS ── -->
  <polygon points="170,515 230,515 218,543 182,543" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="200" y="533" text-anchor="middle" font-size="8" fill="#000000">MON</text>

  <polygon points="570,515 630,515 618,543 582,543" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="533" text-anchor="middle" font-size="8" fill="#000000">MON</text>

  <!-- ── DRUM MONITOR (behind drummer) ── -->
  <polygon points="370,93 430,93 418,115 382,115" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="400" y="109" text-anchor="middle" font-size="8" fill="#000000">MON</text>

  <!-- ── PLAYER NAMES ── -->
  <g font-weight="bold" fill="#000000" text-anchor="middle">
    <text x="160" y="378" font-size="10">Drew</text>
    <text x="300" y="293" font-size="10">Matt</text>
    <text x="400" y="133" font-size="10">Jim</text>
    <text x="500" y="293" font-size="10">Jack</text>
    <text x="640" y="378" font-size="10">Miles</text>
  </g>

  <!-- ── CHANNEL BADGES (match input list) ── -->
  <g font-weight="bold">
    <circle cx="400" cy="312" r="8" fill="#000000"/><text x="400" y="315" text-anchor="middle" font-size="9" fill="#ffffff">1</text>
    <circle cx="376" cy="224" r="8" fill="#000000"/><text x="376" y="227" text-anchor="middle" font-size="9" fill="#ffffff">2</text>
    <circle cx="282" cy="190" r="8" fill="#000000"/><text x="282" y="193" text-anchor="middle" font-size="9" fill="#ffffff">3</text>
    <circle cx="518" cy="190" r="8" fill="#000000"/><text x="518" y="193" text-anchor="middle" font-size="9" fill="#ffffff">4</text>
    <circle cx="476" cy="165" r="8" fill="#000000"/><text x="476" y="168" text-anchor="middle" font-size="9" fill="#ffffff">5</text>
    <circle cx="160" cy="210" r="8" fill="#000000"/><text x="160" y="213" text-anchor="middle" font-size="9" fill="#ffffff">6</text>
    <circle cx="300" cy="99" r="8" fill="#000000"/><text x="300" y="102" text-anchor="middle" font-size="9" fill="#ffffff">7</text>
    <circle cx="590" cy="223" r="8" fill="#000000"/><text x="590" y="226" text-anchor="middle" font-size="9" fill="#ffffff">8</text>
    <circle cx="590" cy="245" r="8" fill="#000000"/><text x="590" y="248" text-anchor="middle" font-size="9" fill="#ffffff">9</text>
    <circle cx="640" cy="201" r="8" fill="#000000"/><text x="640" y="204" text-anchor="middle" font-size="8" fill="#ffffff">10</text>
    <!-- vocal mic channels — same black circles as the rest -->
    <circle cx="180" cy="461" r="8" fill="#000000"/><text x="180" y="464" text-anchor="middle" font-size="8" fill="#ffffff">11</text>
    <circle cx="320" cy="376" r="8" fill="#000000"/><text x="320" y="379" text-anchor="middle" font-size="8" fill="#ffffff">12</text>
    <circle cx="520" cy="376" r="8" fill="#000000"/><text x="520" y="379" text-anchor="middle" font-size="8" fill="#ffffff">13</text>
    <circle cx="660" cy="461" r="8" fill="#000000"/><text x="660" y="464" text-anchor="middle" font-size="8" fill="#ffffff">14</text>
  </g>

  <!-- ── Legend ── -->
  <line x1="80" y1="572" x2="720" y2="572" stroke="#000000" stroke-width="0.5"/>
  <circle cx="102" cy="586" r="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="114" y="590" font-size="10" fill="#000000">Musician</text>
  <polygon points="190,578 198,586 190,594 182,586" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="205" y="590" font-size="10" fill="#000000">Vocal mic</text>
  <rect x="285" y="580" width="18" height="12" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="309" y="590" font-size="10" fill="#000000">Amp</text>
  <rect x="355" y="580" width="28" height="12" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="369" y="590" text-anchor="middle" font-size="8" fill="#000000">DI</text>
  <text x="390" y="590" font-size="10" fill="#000000">Direct In</text>
  <polygon points="448,580 482,580 476,594 454,594" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="490" y="592" font-size="10" fill="#000000">Floor monitor</text>
  <circle cx="600" cy="586" r="8" fill="#000000"/><text x="600" y="589" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">#</text>
  <text x="612" y="590" font-size="10" fill="#000000">Channel #</text>

  <!-- ══════════ INPUT LIST / POWER PANEL ══════════ -->
  <rect x="755" y="58" width="300" height="540" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="905" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000" letter-spacing="2">INPUT LIST</text>
  <line x1="755" y1="90" x2="1055" y2="90" stroke="#000000" stroke-width="1"/>

  <!-- column headers -->
  <text x="770" y="106" font-size="8" fill="#000000" font-weight="bold">CH</text>
  <text x="800" y="106" font-size="8" fill="#000000" font-weight="bold">SOURCE</text>
  <text x="1043" y="106" text-anchor="end" font-size="8" fill="#000000" font-weight="bold">MIC / DI</text>
  <line x1="755" y1="110" x2="1055" y2="110" stroke="#000000" stroke-width="0.5"/>

  <!-- rows -->
  <circle cx="778" cy="124" r="8" fill="#000000"/><text x="778" y="127" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">1</text>
  <text x="800" y="127" font-size="9" fill="#000000">Kick Drum</text>
  <text x="1043" y="127" text-anchor="end" font-size="9" fill="#000000">mic</text>

  <circle cx="778" cy="143" r="8" fill="#000000"/><text x="778" y="146" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">2</text>
  <text x="800" y="146" font-size="9" fill="#000000">Snare</text>
  <text x="1043" y="146" text-anchor="end" font-size="9" fill="#000000">mic</text>

  <circle cx="778" cy="162" r="8" fill="#000000"/><text x="778" y="165" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">3</text>
  <text x="800" y="165" font-size="9" fill="#000000">Overhead L</text>
  <text x="1043" y="165" text-anchor="end" font-size="9" fill="#000000">mic</text>

  <circle cx="778" cy="181" r="8" fill="#000000"/><text x="778" y="184" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">4</text>
  <text x="800" y="184" font-size="9" fill="#000000">Overhead R</text>
  <text x="1043" y="184" text-anchor="end" font-size="9" fill="#000000">mic</text>

  <circle cx="778" cy="200" r="8" fill="#000000"/><text x="778" y="203" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">5</text>
  <text x="800" y="203" font-size="9" fill="#000000">Bass</text>
  <text x="1043" y="203" text-anchor="end" font-size="9" fill="#000000">DI</text>

  <circle cx="778" cy="219" r="8" fill="#000000"/><text x="778" y="222" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">6</text>
  <text x="800" y="222" font-size="9" fill="#000000">Lead Gtr</text>
  <text x="1043" y="222" text-anchor="end" font-size="9" fill="#000000">amp mic</text>

  <circle cx="778" cy="238" r="8" fill="#000000"/><text x="778" y="241" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">7</text>
  <text x="800" y="241" font-size="9" fill="#000000">Keys</text>
  <text x="1043" y="241" text-anchor="end" font-size="9" fill="#000000">XLR from amp</text>

  <circle cx="778" cy="257" r="8" fill="#000000"/><text x="778" y="260" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">8</text>
  <text x="800" y="260" font-size="9" fill="#000000">Aux Keys</text>
  <text x="1043" y="260" text-anchor="end" font-size="9" fill="#000000">DI</text>

  <circle cx="778" cy="276" r="8" fill="#000000"/><text x="778" y="279" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">9</text>
  <text x="800" y="279" font-size="9" fill="#000000">Acoustic Gtr</text>
  <text x="1043" y="279" text-anchor="end" font-size="9" fill="#000000">DI</text>

  <circle cx="778" cy="295" r="8" fill="#000000"/><text x="778" y="298" text-anchor="middle" font-size="8" fill="#ffffff" font-weight="bold">10</text>
  <text x="800" y="298" font-size="9" fill="#000000">Rhythm Gtr</text>
  <text x="1043" y="298" text-anchor="end" font-size="9" fill="#000000">amp mic</text>

  <circle cx="778" cy="314" r="8" fill="#000000"/><text x="778" y="317" text-anchor="middle" font-size="8" fill="#ffffff" font-weight="bold">11</text>
  <text x="800" y="317" font-size="9" fill="#000000">Vox — Drew (Lead Gtr)</text>
  <text x="1043" y="317" text-anchor="end" font-size="9" fill="#000000">mic</text>

  <circle cx="778" cy="333" r="8" fill="#000000"/><text x="778" y="336" text-anchor="middle" font-size="8" fill="#ffffff" font-weight="bold">12</text>
  <text x="800" y="336" font-size="9" fill="#000000">Vox — Matt (Keys)</text>
  <text x="1043" y="336" text-anchor="end" font-size="9" fill="#000000">mic</text>

  <circle cx="778" cy="352" r="8" fill="#000000"/><text x="778" y="355" text-anchor="middle" font-size="8" fill="#ffffff" font-weight="bold">13</text>
  <text x="800" y="355" font-size="9" fill="#000000">Vox — Jack (Bass)</text>
  <text x="1043" y="355" text-anchor="end" font-size="9" fill="#000000">mic</text>

  <circle cx="778" cy="371" r="8" fill="#000000"/><text x="778" y="374" text-anchor="middle" font-size="8" fill="#ffffff" font-weight="bold">14</text>
  <text x="800" y="374" font-size="9" fill="#000000">Vox/Tbn — Miles (Rhy Gtr)</text>
  <text x="1043" y="374" text-anchor="end" font-size="9" fill="#000000">mic</text>

  <!-- notes -->
  <line x1="755" y1="394" x2="1055" y2="394" stroke="#000000" stroke-width="0.5"/>
  <circle cx="774" cy="413" r="8" fill="#000000"/><text x="774" y="416" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">#</text>
  <text x="788" y="416" font-size="8" fill="#000000" font-style="italic">= channel # marked on stage plot</text>
  <text x="768" y="436" font-size="8" fill="#000000" font-style="italic">Stage L/R as seen by the band facing audience.</text>

  <!-- contact -->
  <line x1="755" y1="552" x2="1055" y2="552" stroke="#000000" stroke-width="0.5"/>
  <text x="768" y="572" font-size="10" fill="#000000" font-weight="bold">Miles Shultz · (734) 883-7119</text>
  <text x="768" y="586" font-size="10" fill="#000000" font-weight="bold">Miles@KingsOfEwing.com · KingsOfEwing.com</text>

</svg>
