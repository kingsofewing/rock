<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">

  <!-- Kings of Ewing — Vintage Badge (2026), standard / light use. Self-contained emblem. -->
  <style>@import url('https://fonts.googleapis.com/css2?family=Alfa+Slab+One&amp;family=Oswald:wght@500&amp;display=swap');</style>

  <defs>
    <path id="arcTop" d="M42 140 A98 98 0 0 1 238 140" fill="none"/>
    <path id="arcBot" d="M52 140 A88 88 0 0 0 228 140" fill="none"/>
  </defs>

  <!-- Rings -->
  <circle cx="140" cy="140" r="134" fill="#b5532a"/>
  <circle cx="140" cy="140" r="126" fill="#f2e8d5"/>
  <circle cx="140" cy="140" r="112" fill="none" stroke="#2f5d3a" stroke-width="3"/>

  <!-- Arched text -->
  <text font-family="'Alfa Slab One', serif" font-size="23" letter-spacing="2" fill="#b5532a">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">KINGS OF EWING</textPath>
  </text>
  <text font-family="'Oswald', sans-serif" font-size="13" letter-spacing="4" fill="#2f5d3a">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle">EVANSTON · ILLINOIS</textPath>
  </text>

  <!-- Flanking dots -->
  <circle cx="52" cy="140" r="3.5" fill="#d9a441"/>
  <circle cx="228" cy="140" r="3.5" fill="#d9a441"/>

  <!-- Center star -->
  <g transform="translate(140,150)">
    <path d="M0,-30 L-7.05,-9.71 L-28.53,-9.27 L-11.41,3.71 L-17.63,24.27 L0,12 L17.63,24.27 L11.41,3.71 L28.53,-9.27 L7.05,-9.71 Z"
      fill="#d9a441" stroke="#2f5d3a" stroke-width="2" stroke-linejoin="round"/>
  </g>

</svg>
