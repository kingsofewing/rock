<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">

  <!-- Kings of Ewing icon / submark (2026) — avatars, favicons, stickers -->
  <!-- Square crops cleanly to a circle for Instagram/profile avatars -->
