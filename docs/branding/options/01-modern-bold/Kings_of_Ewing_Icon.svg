  <!-- Ink-black rounded tile -->
  <rect x="0" y="0" width="240" height="240" rx="44" fill="#141414"/>

  <!-- KOE monogram -->
  <text x="120" y="150" text-anchor="middle" font-family="'Anton', sans-serif" font-size="96" fill="#ededea">KOE</text>

  <!-- Signal-red bar accent -->
  <rect x="78" y="172" width="84" height="11" rx="2" fill="#e23b2e"/>

</svg>
