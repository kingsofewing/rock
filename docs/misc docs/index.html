<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Vault</title>
<style>
  :root{
    --bg1:#1a1d29; --bg2:#232838; --card:#2b3145;
    --ink:#e7e9f0; --muted:#9aa0b4; --line:#3a4058;
    --accent:#8b9dff; --accent2:#c9a4ff; --err:#ff8b8b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:radial-gradient(1200px 800px at 20% -10%,#2a2f45 0%,transparent 60%),
               radial-gradient(1000px 700px at 100% 100%,#2c2440 0%,transparent 55%),
               linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .wrap{width:100%;max-width:520px}
  /* Gate */
  .gate{
    background:rgba(43,49,69,.6);
    backdrop-filter:blur(14px);
    border:1px solid var(--line);
    border-radius:20px;
    padding:40px 34px;
    text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.45);
    animation:rise .5s ease both;
  }
  .lock{
    width:60px;height:60px;margin:0 auto 20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 10px 30px rgba(139,157,255,.35);
  }
  .lock svg{width:26px;height:26px;stroke:#1a1d29;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  h1{font-size:1.35rem;font-weight:650;letter-spacing:.2px;margin-bottom:6px}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:26px}
  form{display:flex;flex-direction:column;gap:12px}
  input[type=password]{
    width:100%;padding:14px 16px;font-size:1rem;color:var(--ink);
    background:rgba(26,29,41,.7);border:1px solid var(--line);border-radius:12px;
    outline:none;transition:border-color .2s,box-shadow .2s;text-align:center;letter-spacing:.15em;
  }
  input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,157,255,.18)}
  button{
    padding:14px 16px;font-size:1rem;font-weight:600;color:#171a24;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;border-radius:12px;transition:transform .12s,filter .2s;
  }
  button:hover{filter:brightness(1.06)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.6;cursor:default}
  .err{color:var(--err);font-size:.85rem;min-height:1.1em;transition:opacity .2s}
  .shake{animation:shake .4s}
  /* Vault */
  .vault{display:none;animation:rise .5s ease both}
  .vhead{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding:0 4px}
  .vhead .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .vhead h2{font-size:1.1rem;font-weight:600}
  .vhead .count{margin-left:auto;color:var(--muted);font-size:.82rem}
  .card{
    display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;margin-bottom:12px;transition:transform .15s,border-color .2s,background .2s;
  }
  .card:hover{transform:translateY(-2px);border-color:var(--accent);background:#30374e}
  .cicon{
    flex:0 0 44px;width:44px;height:44px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,rgba(139,157,255,.22),rgba(201,164,255,.22));
  }
  .cicon svg{width:22px;height:22px;stroke:var(--accent2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ctext .t{font-weight:600;font-size:1rem}
  .ctext .d{color:var(--muted);font-size:.85rem;margin-top:2px}
  .arrow{margin-left:auto;color:var(--muted);transition:transform .15s}
  .card:hover .arrow{transform:translateX(3px);color:var(--accent)}
  .foot{text-align:center;color:var(--muted);font-size:.75rem;margin-top:18px;opacity:.7}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
</style>
</head>
<body>
<div class="wrap">

  <div class="gate" id="gate">
    <div class="lock">
      <svg viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
    </div>
    <h1>Protected</h1>
    <p class="sub">Enter the password to view contents.</p>
    <form id="form">
      <input type="password" id="pw" placeholder="••••••" autocomplete="off" autofocus>
      <button type="submit" id="btn">Unlock</button>
      <div class="err" id="err"></div>
    </form>
  </div>

  <div class="vault" id="vault">
    <div class="vhead">
      <span class="dot"></span>
      <h2>Documents</h2>
      <span class="count" id="count"></span>
    </div>
    <div id="list"></div>
    <div class="foot">Contents decrypted locally in your browser.</div>
  </div>

</div>

<script>
const PAYLOAD = {"salt":"6B7sKPbbPSbD9n3nx+ddrw==","iv":"jzqTz9/3o8EYDC7T","iterations":250000,"data":"1tUs3ziXWXPe8WhtDmfOXzCVrasco72cl+GQRKq23XF2Ypz+Q92dcZ4eeOvKF3oJP6w4T913IHOL+R20vmBdCxX5go3me4M3izEHPb5ZTmjLpX6Bo48Xwdw2dETWq5bpNlO9KnHCXBpLCY/ParLYkAsCAGo/z+EkFU6QFBN4K7RmJIZPcsKhC71ryP3NLnRDYnAKDXlVc391vym/ANV0LZXlRViFk3zHCjffINpo22ckrYTInpjsTnJybz/nbigVkn1kdbJlcZkxmqx5dq7mmyWShsKxTtjdBVaiLnLCtYzL5fNXT1zxsB+hcMJSyBnvat3+DB5wpzbm9uVUdnp9J0/setSrOohy+5qPwXxjpLYlpCMEwz5rL/paRB/Eb+F5dX9frcnJTYyrzSZaZUBmuRWHyU9EaeWwvc6MiAyGdv/QuUP3MMZKflVcEX4pgv/5qe0dUIA/W/9pwwyMqMTKF0gOEfSIXElyfwRoGQe2X/HAnkqA+LhGDC6dhn4ftSuyfgA0+c8uY+Wgg+KKaLd/6Nol21wxAbmdPImzR3Fsn5Wd6hcWYWyo4LKpgeb13oR5gNyzglapcNT7sm1HqvPKsXRjVN1YhnqnV2GS/FsUY5mb1vzdbukFB7oEBbjRZ8Xx3KkP/JR29wUJLWrdKjzqpFIc2iMQrw+fvInXy/IV/v/vqvjqqCrKt84gJBv9LQ9GIhlR2hoKCv28Pjn+tEE/SshPd4OgahrdMBHOcPF5S3O5qWdV/5UkxAJwceALTyhTCAyDEEd59KIqjsryu2otEB+xPIdOYY+8/zoV8RylgQgx+5AwsUMSWHrBV8oq8TEd4gGywckNbBpTF2Zd6ZJBAKjtkJqERIJujnM="};

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(password){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iterations, hash:'SHA-256'},
    baseKey, {name:'AES-GCM', length:256}, false, ['decrypt']
  );
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

function render(docs){
  document.getElementById('gate').style.display = 'none';
  const vault = document.getElementById('vault');
  vault.style.display = 'block';
  document.getElementById('count').textContent = docs.length + (docs.length===1?' item':' items');
  const list = document.getElementById('list');
  list.innerHTML = docs.map(d => `
    <a class="card" href="${d.href}">
      <span class="cicon"><svg viewBox="0 0 24 24"><path d="${d.icon || 'M6 2h9l5 5v15H6z M15 2v5h5'}"/></svg></span>
      <span class="ctext"><span class="t">${d.title}</span><span class="d">${d.desc||''}</span></span>
      <span class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>`).join('');
}

const form = document.getElementById('form');
const err = document.getElementById('err');
const btn = document.getElementById('btn');
const gate = document.getElementById('gate');

form.addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  if(!pw) return;
  btn.disabled = true; err.textContent = '';
  try{
    const docs = await unlock(pw);
    render(docs);
  }catch(_){
    err.textContent = 'Incorrect password';
    gate.classList.remove('shake'); void gate.offsetWidth; gate.classList.add('shake');
    btn.disabled = false;
    document.getElementById('pw').select();
  }
});
</script>
</body>
</html>
