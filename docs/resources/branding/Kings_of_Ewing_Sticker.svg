<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220" viewBox="0 0 700 220">

  <!-- Cream background -->
  <rect x="0" y="0" width="700" height="220" rx="30" fill="#e8dfc0"/>

  <!-- Coral outer border -->
  <rect x="4" y="4" width="692" height="212" rx="27" fill="none" stroke="#c8623a" stroke-width="6"/>

  <!-- Teal inner border -->
  <rect x="14" y="14" width="672" height="192" rx="20" fill="none" stroke="#4fb3a8" stroke-width="2.5"/>

  <!-- Kings of Ewing wordmark in Damion (loads Google Fonts) — layered retro shadow -->
  <style>@import url('https://fonts.googleapis.com/css2?family=Damion&amp;display=swap');</style>
  <!-- coral layer -->
  <text x="354" y="140" text-anchor="middle"
    font-family="'Damion', cursive"
    font-size="78" fill="#c8623a">Kings of Ewing</text>
  <!-- teal layer -->
  <text x="352" y="138" text-anchor="middle"
    font-family="'Damion', cursive"
    font-size="78" fill="#4fb3a8">Kings of Ewing</text>
  <!-- dark top layer -->
  <text x="350" y="136" text-anchor="middle"
    font-family="'Damion', cursive"
    font-size="78" fill="#1e0e08">Kings of Ewing</text>

</svg>
