<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Kings of Ewing</title>
<link rel="icon" type="image/png" href="/docs/branding/Kings_of_Ewing_Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Pacifico&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:    #3d4f58;
    --cream: #e8dfc0;
    --teal:  #4fb3a8;
    --coral: #c8623a;
    --brown: #1e0e08;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--brown);
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    position: relative;
    overflow-x: hidden;
  }
  .hero-bg {
    position: fixed;
    inset: 0;
    background-image: url('/docs/images/IMG_2445.jpeg');
    background-size: cover;
    background-position: center 40%;
    filter: brightness(0.35);
    z-index: 0;
  }
  body > *:not(.hero-bg) { position: relative; z-index: 1; }
  img.logo { height: 110px; margin-bottom: 1.5rem; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6)); }
  .code {
    font-family: 'Pacifico', cursive;
    font-size: clamp(5rem, 20vw, 10rem);
    color: var(--coral);
    line-height: 1;
    margin-bottom: 0.5rem;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  h1 {
    font-family: 'Lobster', cursive;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    color: var(--cream);
    margin-bottom: 1rem;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  p {
    font-size: 1rem;
    color: rgba(232,223,192,0.85);
    font-weight: 300;
    max-width: 380px;
    line-height: 1.75;
    margin-bottom: 2rem;
    text-shadow: 0 1px 6px rgba(0,0,0,0.7);
  }
  .divider { width: 40px; height: 2px; background: var(--teal); margin: 1rem auto 1.5rem; }
  .btn {
    display: inline-block;
    padding: 0.75rem 2rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-decoration: none;
    background: var(--coral);
    color: var(--brown);
    border: 2px solid var(--coral);
    transition: all 0.22s;
  }
  .btn:hover { background: var(--cream); border-color: var(--cream); }
</style>
</head>
<body>
  <div class="hero-bg"></div>
  <img class="logo" src="/docs/branding/Kings_of_Ewing_Logo.png" alt="Kings of Ewing logo">
  <div class="code">404</div>
  <h1>Lost on Ewing Ave.</h1>
  <div class="divider"></div>
  <p>Looks like this page took a wrong turn somewhere between the Fat Shallot and the block party. Let's get you back.</p>
  <a href="/" class="btn">Back to the Band</a>
</body>
</html>
