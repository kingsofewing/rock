<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Kings of Ewing</title>
<link rel="icon" type="image/png" href="/docs/branding/Kings_of_Ewing_Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Pacifico&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:    #3d4f58;
    --cream: #e8dfc0;
    --teal:  #4fb3a8;
    --coral: #c8623a;
    --brown: #1e0e08;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--brown);
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .code {
    font-family: 'Pacifico', cursive;
    font-size: clamp(5rem, 20vw, 10rem);
    color: var(--coral);
    line-height: 1;
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: 'Lobster', cursive;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    color: var(--cream);
    margin-bottom: 1rem;
  }
  p {
    font-size: 1rem;
    color: rgba(232,223,192,0.6);
    font-weight: 300;
    max-width: 380px;
    line-height: 1.75;
    margin-bottom: 2rem;
  }
  .divider { width: 40px; height: 2px; background: var(--teal); margin: 1rem auto 1.5rem; }
  .btn {
    display: inline-block;
    padding: 0.75rem 2rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-decoration: none;
    background: var(--coral);
    color: var(--brown);
    border: 2px solid var(--coral);
    transition: all 0.22s;
  }
  .btn:hover { background: var(--cream); border-color: var(--cream); }
  .hero-banner {
    position: relative;
    width: min(860px, 92vw);
    aspect-ratio: 5 / 2;
    margin-top: 2.5rem;
    background-image: linear-gradient(rgba(30,14,8,0.45), rgba(30,14,8,0.45)), url('/docs/images/IMG_2445.jpeg');
    background-size: cover;
    background-position: center 40%;
    border-radius: 4px;
    overflow: hidden;
  }
  .hero-banner img {
    position: absolute;
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%);
    width: 92%;
    height: auto;
    display: block;
  }
</style>
</head>
<body>
  <div class="code">404</div>
  <h1>Lost on Ewing Ave.</h1>
  <div class="divider"></div>
  <p>Looks like this page took a wrong turn somewhere between the Fat Shallot and the block party. Let's get you back.</p>
  <a href="/" class="btn">Back to the Band</a>
  <a href="/" aria-label="Kings of Ewing home"><div class="hero-banner"><img src="/docs/branding/kings_of_ewing_title.svg" alt="Kings of Ewing"></div></a>
</body>
</html>
